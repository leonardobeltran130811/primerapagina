<!DOCTYPE html>
<html>
<head>
    <title>Leonardo</title>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            font-size: 50px;
        }

        p {
            font-size: 20px;
            color: #94a3b8;
        }

        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        img {
            border-radius: 50%;
            margin-top: 20px;
        }

        a {
            background: #22c55e;
            color: black;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hola, soy Leonardo 💪</h1>
        <p>Me gusta el gym y la tecnología</p>

        <img src="https://via.placeholder.com/150" alt="foto">

        <a href="#">Ver mi progreso 💪</a>
    </div>
</body>
</html>
